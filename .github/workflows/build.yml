name: Test and Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        cd src
        python -m pytest test_handlers.py -v --tb=short

  build:
    needs: test  # Only build if tests pass
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: SapPriceUpdater-Linux
            asset_name: SapPriceUpdater-Linux
          - os: windows-latest
            artifact_name: SapPriceUpdater-Windows
            asset_name: SapPriceUpdater-Windows
          - os: macos-latest
            artifact_name: SapPriceUpdater-MacOS
            asset_name: SapPriceUpdater-MacOS

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconfirm --onedir --windowed --clean --name "SapPriceUpdater" "src/main.py"

    - name: Build with PyInstaller (Linux/MacOS)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --noconfirm --onedir --windowed --clean --name "SapPriceUpdater" "src/main.py"

    - name: Compress artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path "dist/SapPriceUpdater/*" -DestinationPath "${{ matrix.artifact_name }}.zip"
      shell: pwsh

    - name: Compress artifact (Linux/MacOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd dist
        zip -r "../${{ matrix.artifact_name }}.zip" SapPriceUpdater

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.zip
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write  # Required to create the release and upload assets

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          artifacts/SapPriceUpdater-Linux/SapPriceUpdater-Linux.zip
          artifacts/SapPriceUpdater-Windows/SapPriceUpdater-Windows.zip
          artifacts/SapPriceUpdater-MacOS/SapPriceUpdater-MacOS.zip
